name: Build Russell Kestrel iOS V7

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true

          if [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          else
            echo "Xcode 26.0.1 not found, using default Xcode"
          fi

          xcodebuild -version

      - name: Find Xcode project
        run: |
          echo "Looking for Xcode project..."
          find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Build Russell Kestrel
        run: |
          rm -rf build

          xcodebuild \
            -project RussellKestrel.xcodeproj \
            -scheme RussellKestrel \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            | tee build.log

      - name: Locate built application
        run: |
          echo "Searching for RussellKestrel.app..."
          find build -type d -name "RussellKestrel.app" -print

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build -type d -name "RussellKestrel.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: RussellKestrel.app was not found."
            echo "Build directory:"
            find build -maxdepth 5 -print || true
            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/RussellKestrel.app

          mkdir -p artifacts

          cd Payload
          zip -r ../artifacts/Russell-Kestrel-iOS-V7-unsigned.ipa RussellKestrel.app
          cd ..

          echo "IPA created:"
          ls -lh artifacts/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Kestrel-iOS-V7-unsigned
          path: artifacts/Russell-Kestrel-iOS-V7-unsigned.ipa
          if-no-files-found: error
