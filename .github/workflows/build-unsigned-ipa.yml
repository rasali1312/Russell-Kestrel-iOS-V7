name: Build Russell Kestrel iOS V7

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - repair-v7-source-paths-and-ipa-validation

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode*.app || true

          if [ -d "/Applications/Xcode_26.0.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app
          else
            echo "Xcode 26.0.1 not found, using default Xcode"
          fi

          xcodebuild -version

      - name: Find Xcode project
        run: |
          echo "Looking for Xcode project..."
          find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Build Russell Kestrel
        run: |
          set -euo pipefail
          rm -rf build

          xcodebuild \
            -project RussellKestrel.xcodeproj \
            -scheme RussellKestrel \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            | tee build.log

      - name: Locate built application
        run: |
          echo "Searching for RussellKestrel.app..."
          find build -type d -name "RussellKestrel.app" -print

      - name: Create unsigned IPA
        run: |
          APP_PATH=$(find build -type d -name "RussellKestrel.app" -print -quit)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: RussellKestrel.app was not found."
            echo "Build directory:"
            find build -maxdepth 5 -print || true
            exit 1
          fi

          echo "Found application:"
          echo "$APP_PATH"

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "ERROR: app bundle has no Info.plist"
            exit 1
          fi

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          EXECUTABLE_PATH="$APP_PATH/$EXECUTABLE_NAME"
          if [ ! -s "$EXECUTABLE_PATH" ]; then
            echo "ERROR: app executable is missing or empty: $EXECUTABLE_PATH"
            echo "Bundle contents:"
            find "$APP_PATH" -maxdepth 3 -print
            exit 1
          fi

          echo "Verified executable: $EXECUTABLE_PATH"
          ls -lh "$EXECUTABLE_PATH"

          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/RussellKestrel.app

          mkdir -p artifacts

          zip -r artifacts/Russell-Kestrel-iOS-V7-unsigned.ipa Payload/RussellKestrel.app

          echo "IPA created:"
          ls -lh artifacts/

          IPA_PATH="artifacts/Russell-Kestrel-iOS-V7-unsigned.ipa"
          IPA_BYTES=$(stat -f%z "$IPA_PATH")
          if [ "$IPA_BYTES" -lt 100000 ]; then
            echo "ERROR: IPA is suspiciously small ($IPA_BYTES bytes)"
            exit 1
          fi

          if ! unzip -l "$IPA_PATH" | grep -F "Payload/RussellKestrel.app/$EXECUTABLE_NAME" >/dev/null; then
            echo "ERROR: executable is missing from packaged IPA"
            unzip -l "$IPA_PATH"
            exit 1
          fi
          echo "IPA validation passed ($IPA_BYTES bytes; executable included)."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Kestrel-iOS-V7-unsigned
          path: artifacts/Russell-Kestrel-iOS-V7-unsigned.ipa
          if-no-files-found: error
