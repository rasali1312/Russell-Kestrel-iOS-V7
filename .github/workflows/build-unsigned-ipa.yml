name: Build Russell Kestrel iOS V7

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.1.app
          xcodebuild -version

      - name: Find project
        run: |
          echo "Project files:"
          find . -maxdepth 3 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

      - name: Build
        run: |
          xcodebuild \
            -project RussellKestrel.xcodeproj \
            -scheme RussellKestrel \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build \
            | tee build.log

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/RussellKestrel.app Payload/

          mkdir -p artifacts
          /usr/bin/zip -r \
            artifacts/Russell-Kestrel-iOS-V7-unsigned.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Kestrel-iOS-V7-unsigned
          path: artifacts/Russell-Kestrel-iOS-V7-unsigned.ipa
